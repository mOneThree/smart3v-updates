name: Smart 3V Updater
version: "0.1.0"
slug: smart3v_updater
description: Fetches new Smart 3V firmware and hands it to the Matter Server, so updates show up on each board's page.
url: "https://github.com/mOneThree/smart3v-updates"
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
hassio_api: true
hassio_role: manager
homeassistant_api: true
map:
  - all_addon_configs:rw
options:
  check_interval_minutes: 5
  restart_matter_server: immediately
  quiet_time: "03:00"
  scan_wait_minutes: 11
schema:
  check_interval_minutes: int(1,1440)
  restart_matter_server: list(immediately|quiet_time)
  quiet_time: match(^([01][0-9]|2[0-3]):[0-5][0-9]$)
  scan_wait_minutes: int(0,60)
  manifest_url: url?
  matter_server_slug: str?
